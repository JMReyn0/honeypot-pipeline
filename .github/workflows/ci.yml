name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipeline/requirements.txt ruff
      - name: lint
        run: ruff check pipeline/
      - name: regenerate the sample
        run: python pipeline/_gen_sample.py
      - name: run the pipeline end to end
        run: |
          rm -f data/attacks.db
          python pipeline/ingest.py data/sample/cowrie.sample.json
          python pipeline/ingest.py data/sample/cowrie.sample.json  # idempotency
          python pipeline/report.py
      - name: check outputs exist and are non-trivial
        run: |
          test -s site/index.html
          test -s data/blocklist.txt
          test -s data/credentials.csv
          test -s THREATS.md
          grep -q "sessions" THREATS.md
      - name: sample must be reproducible (no drift)
        run: git diff --exit-code data/sample/cowrie.sample.json
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            site/
            THREATS.md
            data/blocklist.txt
