# Cowrie config for honeypot-pipeline. Overrides cowrie.cfg.dist defaults.
# Full reference: https://docs.cowrie.org/en/latest/CONFIGURE.html

[honeypot]
hostname = srv-prod-01
# a plausible box; attackers fingerprint this
auth_class = UserDB
download_limit_size = 20971520

[shell]
filesystem = share/cowrie/fs.pickle
processes = share/cowrie/cmdoutput.json

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.4
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

# JSON is what pipeline/ingest.py reads
[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = false
